<div style="max-width: 1200px; margin: 0 auto; padding: 1rem;">

    <!-- Header -->
    <div style="margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem;">
        <h1 style="font-size: 2.5rem; color: var(--text-main); font-weight: 800; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-truck-ramp-box" style="color: var(--primary-color);"></i>
            Panel del Proveedor
        </h1>
        <p id="prov-bienvenida" style="color: var(--text-muted); font-size: 1.05rem; margin: 0;"></p>
    </div>

    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <div class="stat-card border-primary" style="background: var(--card-bg); border-left: 5px solid var(--primary-color); padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;">
            <span class="stat-label" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-boxes-stacked" style="margin-right: 0.4rem; color: var(--primary-color);"></i> Catálogo General
            </span>
            <span class="stat-number" id="prov-stat-productos" style="font-size: 2.2rem; font-weight: 800; color: var(--text-main);">0</span>
        </div>
        <div class="stat-card border-blue" style="background: var(--card-bg); border-left: 5px solid #3b82f6; padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;">
            <span class="stat-label" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-warehouse" style="margin-right: 0.4rem; color: #3b82f6;"></i> Stock en mi Sucursal
            </span>
            <span class="stat-number" id="prov-stat-stock" style="font-size: 2.2rem; font-weight: 800; color: var(--text-main);">0</span>
        </div>
        <div class="stat-card border-orange" style="background: var(--card-bg); border-left: 5px solid #f97316; padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;">
            <span class="stat-label" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-truck-fast" style="margin-right: 0.4rem; color: #f97316;"></i> Mis Solicitudes
            </span>
            <span class="stat-number" id="prov-stat-movimientos" style="font-size: 2.2rem; font-weight: 800; color: var(--text-main);">0</span>
        </div>
    </div>

    <!-- Tabs -->
    <div style="display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        <button class="prov-tab active" data-tab="solicitar" style="padding: 0.6rem 1.2rem; border: none; background: transparent; cursor: pointer; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); transition: var(--transition);">
            <i class="fa-solid fa-truck-arrow-right"></i> Solicitar Entrega
        </button>
        <button class="prov-tab" data-tab="inventario" style="padding: 0.6rem 1.2rem; border: none; background: transparent; cursor: pointer; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); transition: var(--transition);">
            <i class="fa-solid fa-warehouse"></i> Ver Stock
        </button>
        <button class="prov-tab" data-tab="movimientos" style="padding: 0.6rem 1.2rem; border: none; background: transparent; cursor: pointer; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); transition: var(--transition);">
            <i class="fa-solid fa-clock-rotate-left"></i> Movimientos Sede
        </button>
    </div>

    <!-- Contenido de tab -->
    <div id="prov-tab-content" class="admin-content" style="background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); overflow: hidden; min-height: 400px;"></div>

</div>
